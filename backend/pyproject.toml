[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dancing-cats-backend"
version = "0.3.0"
description = "Local music analysis and choreography service for Dancing Cats"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "yt-dlp[default]",
]

[project.optional-dependencies]
analysis = [
  "beat-this>=1.1,<2",
  "librosa>=0.10.2,<0.12",
]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
dancing-cats-backend = "dancing_cats_backend.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/dancing_cats_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
