[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dancing-cats-backend"
version = "0.5.2"
description = "Local music analysis and choreography service for Dancing Cats"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "fastapi==0.115.14",
  "pydantic==2.11.7",
  "uvicorn[standard]==0.34.3",
  "yt-dlp[default]",
]

[project.optional-dependencies]
analysis = [
  "beat-this==1.1.0",
  "librosa==0.11.0",
]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
dancing-cats-backend = "dancing_cats_backend.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/dancing_cats_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
